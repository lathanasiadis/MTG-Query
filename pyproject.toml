[project]
name = "MTG-Query"
version = "0.2.5"
description = "Rules QA agent, with RAG, for Magic: The Gathering"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.16",
    "langchain-chroma>=1.1.0",
    "langchain-deepseek>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyahocorasick>=2.3.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.62.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
