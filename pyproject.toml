[project]
name = "MTG-Query"
version = "0.2.0"
description = "MTG natural language card search"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6.2",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-deepseek>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "numpy>=2.5.2",
    "pyahocorasick>=2.3.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
    "tqdm>=4.69.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

